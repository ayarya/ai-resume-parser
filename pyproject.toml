[project]
name = "ai-resume-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayush Arya", email = "arya.ayush409@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-resume-parser = "ai_resume_parser:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "venv",
]
